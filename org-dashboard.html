  .logo{display:flex; align-items:center; gap:10px; color:var(--chalk); font-family:'Anton',sans-serif; font-size:17px; white-space:nowrap;}
  .logo-mark{width:34px; height:34px;}

  .nav-right{display:flex; align-items:center; gap:10px; min-width:0;}

  .nav-right a:hover, .nav-right button.link:hover{color:var(--gold);}

  .shell{max-width:1180px; margin:0 auto; padding:22px 20px 90px; display:grid; grid-template-columns:210px 1fr; gap:24px; align-items:start;}
  @media (max-width:860px){ .shell{grid-template-columns:1fr; gap:14px; padding:14px 14px 80px;} }
  .tabs{position:sticky; top:68px; display:flex; flex-direction:column; gap:4px;}
  @media (max-width:860px){ .tabs{position:static; flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:6px; -webkit-overflow-scrolling:touch;} }
  .tab{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 14px; border-radius:8px; font-size:14px; font-weight:600; color:#4a4940; white-space:nowrap; background:none; border:none; text-align:left; min-height:42px;}

  .welcome{background:var(--field); color:var(--chalk); border-radius:16px; padding:26px 22px; margin-bottom:18px;}

  .welcome .act:hover{border-color:var(--gold);}
  .welcome .act b{display:block; font-size:15px;} .welcome .act span{font-size:12.5px; color:var(--chalk-dim);}
  .banner{border:1.5px solid var(--gold); background:#fffaf0; border-radius:12px; padding:14px 16px; margin-bottom:16px; font-size:14px;}

  .checklist{list-style:none; display:grid; gap:6px; font-size:13.5px; margin-top:8px;}
  .checklist li::before{content:"○ "; color:#a8a596;} .checklist li.done::before{content:"✓ "; color:var(--turf); font-weight:700;} .checklist li.done{color:#6b6a63;}

  .thread{margin-top:10px; background:#fdfcf9; border:1px solid rgba(28,27,24,.08); border-radius:10px; padding:12px; width:100%;}
  .msgs{display:flex; flex-direction:column; gap:7px; max-height:240px; overflow-y:auto; margin-bottom:10px;}
  .bubble{max-width:82%; padding:8px 12px; border-radius:10px; font-size:13px; white-space:pre-wrap; word-break:break-word;}
  .bubble.me{align-self:flex-end; background:var(--field); color:var(--chalk);} .bubble.them{align-self:flex-start; background:var(--chalk-dim);}
  .bubble small{display:block; opacity:.65; font-size:10.5px; margin-top:3px;}
  .composer{display:flex; gap:8px; align-items:flex-end;} .composer textarea{min-height:44px; max-height:100px;}

  .modal-back{position:fixed; inset:0; background:rgba(15,36,28,.6); z-index:80; display:flex; align-items:center; justify-content:center; padding:16px; overflow-y:auto;}
  .modal{background:#fff; border-radius:16px; padding:24px; max-width:560px; width:100%; max-height:92vh; overflow-y:auto;}
  .modal h2{font-family:'Anton',sans-serif; text-transform:uppercase; font-weight:400; font-size:22px; color:var(--field); margin-bottom:8px;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--field); color:var(--chalk); padding:12px 20px; border-radius:30px; font-size:14px; z-index:99; transition:opacity .25s, transform .25s; pointer-events:none; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .spinner{padding:60px 0; text-align:center; color:#8a8878;}
  table.tbl{width:100%; border-collapse:collapse; font-size:13px;} table.tbl th{text-align:left; padding:6px 8px; color:#8a8878; font-weight:600;} table.tbl td{padding:8px; border-top:1px solid rgba(28,27,24,.07);}
</style>

<script>
const SUPABASE_URL = 'https://gaeekblnbhxtcqdeesra.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_D04JKsI8CJOUihOiQFr8xA_HCMt5Hhs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DRAFT_KEY = 'remedy_org_signup_v1', LOGO_KEY = 'remedy_org_logo_v1', ANON_KEY = 'remedy_anon_id', ORG_KEY = 'remedy_current_org', WELCOME_KEY = 'remedy_org_welcome_dismissed';
const ORG_TYPES = ['High School','Middle School','College / University','Professional Sports Organization','Youth Sports Organization','Travel / Club Team','Athletic Department','Sports Camp','Training Facility','Nonprofit','Sports Business','Community Organization','Individual Team','Other'];

];

const LEVELS_FOR_TYPE = {'High School':['High School'],'Middle School':['Middle School'],'College / University':['College'],'Professional Sports Organization':['Semi-Pro/Pro'],'Youth Sports Organization':['Youth'],'Sports Camp':['Youth'],'Travel / Club Team':['Youth','High School'],'Athletic Department':['High School','College']};

};

const S = {

  opps:[], apps:[], invitations:[], inquiries:[], members:[], teamInvites:[], verifications:[], myInvites:[],
  coaches:null, filters:{ sport:'', specialties:[], state:'', city:'', minYears:'', cert:'', accomplishments:'', availability:'', format:'', maxPrice:'', verifiedOnly:false },

};
const TABS = [['overview','Overview'],['find','Find a Coach'],['post','Post an Opportunity'],['applications','Applications'],['invitations','Invitations & Messages'],['profile','Organization Profile'],['team','Team'],['verification','Verification']];

/* ---------------- helpers ---------------- */
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function initials(n){ return (n||'').trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase()||'').join('') || '?'; }
function fmtDate(d){
  if(!d) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);   // date-only values are calendar days, not UTC instants
  return (m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(d)).toLocaleDateString();
}
function money(c){ return c ? '$' + Math.round(c/100).toLocaleString() : ''; }
function budgetLabel(min, max){ if(min && max && min !== max) return `${money(min)}–${money(max)}`; if(min) return money(min) + (max ? '' : '+'); return 'Budget TBD'; }
function can(p){ return !!S.perms[p]; }
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200); }
function friendly(err){
  const m = (err && (err.message || err)) + '';
  if(m.includes('EMAIL_NOT_VERIFIED')) return 'Please verify your email before publishing an opportunity.';
  if(m.includes('DUPLICATE_ORGANIZATION')) return 'An organization with this name or website already exists. Ask its owner to invite you to the team.';
  if(m.includes('OWNER_REQUIRED')) return 'Only an organization owner can change owners or administrators.';
  if(m.includes('LAST_OWNER')) return 'An organization must keep at least one owner.';
  if(m.includes('MESSAGING_REQUIRES_PROFESSIONAL_PLAN')) return 'Sending messages requires a Professional or Elite plan.';
  if(m.includes('RATE_LIMITED')) return 'Too many messages today — please try again tomorrow.';
  if(m.includes('duplicate key')) return 'That already exists.';
  if(m.includes('row-level security')) return 'You don\'t have permission to do that.';
  return m.replace(/^[A-Z_]+:\s*/, '');
}
function anonId(){ try{ return localStorage.getItem(ANON_KEY); }catch(e){ return null; } }

async function track(name, props = {}, dedupe = null, orgId = undefined){
  try{
    const row = { event_name:name, anonymous_id:anonId(), properties:props, user_id:S.user?.id ?? null, organization_id: orgId !== undefined ? orgId : (S.org?.id ?? null) };
    if(dedupe){ row.dedupe_key = dedupe; await sb.from('analytics_events').insert(row); /* a repeat is rejected by the unique dedupe_key — that's the point */ }
    else await sb.from('analytics_events').insert(row);
  }catch(e){}
}

function openModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-back" id="modal-back"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById('modal-back').addEventListener('mousedown', e => { if(e.target.id === 'modal-back') closeModal(); });
  const f = root.querySelector('textarea,input,select'); if(f) setTimeout(() => f.focus(), 50);
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* ---------------- boot ---------------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.replace('login.html?next=' + encodeURIComponent('org-dashboard.html' + location.hash)); return; }
  S.user = session.user;
  document.getElementById('signout').addEventListener('click', async () => { await sb.auth.signOut(); location.href = 'index.html'; });
  track('email_verified', {}, 'email_verified:' + S.user.id, null);

  await loadCatalog();
  await loadMemberships();

  if(!S.memberships.length){
    const created = await finalizeFromDraft();
    if(created) await loadMemberships();
  }
  if(!S.memberships.length){ await renderNoOrg(); return; }

  const saved = (() => { try{ return localStorage.getItem(ORG_KEY); }catch(e){ return null; } })();
  const chosen = S.memberships.find(m => m.organization_id === saved) || S.memberships[0];
  await selectOrg(chosen.organization_id);

  window.addEventListener('hashchange', () => { setTab(location.hash.slice(1) || 'overview', false); });
  S.tab = (location.hash.slice(1) || 'overview');
  if(!TABS.some(t => t[0] === S.tab)) S.tab = 'overview';
  render();
}

async function loadCatalog(){
  const [{ data:sp }, { data:ex }] = await Promise.all([
    sb.from('sports').select('name, sort_order').order('sort_order'),
    sb.from('expertise').select('name, coach_specialty, sports!inner(name)')
  ]);
  S.catalog.sports = (sp || []).map(r => r.name);
  S.catalog.expertise = {};
  (ex || []).forEach(r => { (S.catalog.expertise[r.sports.name] ||= []).push({ name:r.name, coach_specialty:r.coach_specialty }); });
  Object.values(S.catalog.expertise).forEach(l => l.sort((a,b) => a.name.localeCompare(b.name)));

async function loadMemberships(){
  const { data } = await sb.from('organization_members')

async function selectOrg(orgId){
  const m = S.memberships.find(x => x.organization_id === orgId) || S.memberships[0];

  S.coaches = null; S.results = null; S.oppForm = null; S.editingOpp = null; S.openThread = null;

async function loadOrgData(){
  const id = S.member.organization_id;
  const { data:org } = await sb.from('organizations')
    .select('*, organization_sports(custom_name, sports(id,name)), organization_expertise(expertise(id,name,coach_specialty,sports(name))), organization_needs(need_type,custom_text)')
    .eq('id', id).single();
  S.org = org;

  const [opps, inv, inq, mem, ti, ver, sub] = await Promise.all([
    sb.from('opportunities').select('*').eq('organization_id', id).order('created_at', { ascending:false }),
    sb.from('consult_invitations').select('*').eq('organization_id', id).order('created_at', { ascending:false }),
    sb.from('organization_inquiries').select('*').eq('organization_id', id).order('created_at', { ascending:false }),
    sb.from('organization_members').select('*').eq('organization_id', id).order('created_at'),
    sb.from('organization_invites').select('*').eq('organization_id', id).eq('status','pending').order('created_at', { ascending:false }),
    sb.from('organization_verification_requests').select('*').eq('organization_id', id).order('created_at', { ascending:false }),
    sb.from('subscriptions').select('plan,status').eq('user_id', S.user.id).maybeSingle()
  ]);
  S.opps = opps.data || []; S.invitations = inv.data || []; S.inquiries = inq.data || [];
  S.members = mem.data || []; S.teamInvites = ti.data || []; S.verifications = ver.data || [];
  S.plan = (sub.data && sub.data.status === 'active') ? sub.data.plan : 'free';

  // Applicants across every opportunity, with the applying coach's public profile.
  const oppIds = S.opps.map(o => o.id);
  S.apps = [];
  if(oppIds.length && (can('manage_applicants'))){
    const { data:apps } = await sb.from('applications').select('*').in('opportunity_id', oppIds).order('created_at', { ascending:false });

  const ids = [...new Set([...S.apps.map(a => a.coach_id), ...S.invitations.map(i => i.coach_id), ...S.inquiries.map(q => q.from_user_id)])];

    (ps || []).forEach(p => S.people[p.id] = p);

async function loadMyInvites(){

/* ---------------- first run: turn the sign-up draft into a real organization ---------------- */
async function finalizeFromDraft(){
  let draft = S.user.user_metadata?.org_draft || null;
  let fromMeta = !!draft;
  if(!draft){
    try{
      const local = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
      if(local && local.data && local.data.org_name){ draft = localDraftToMeta(local.data); }
    }catch(e){}
  }
  if(!draft || !draft.payload) return false;

  const { data:orgId, error } = await sb.rpc('create_organization', { payload: draft.payload });
  if(error){ S.draftError = friendly(error); return false; }

  S.justCreated = true;
  try{
    const logo = JSON.parse(localStorage.getItem(LOGO_KEY) || 'null');
    if(logo && logo.dataUrl){
      const blob = await (await fetch(logo.dataUrl)).blob();
      const path = `${orgId}/logo.png`;
      const up = await sb.storage.from('org-logos').upload(path, blob, { upsert:true, contentType:'image/png' });
      if(!up.error){
        const url = sb.storage.from('org-logos').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
        await sb.from('organizations').update({ logo_url:url }).eq('id', orgId);
      }
    }
  }catch(e){}
  try{
    const v = draft.verification;
    if(v){
      const p = draft.payload;
      await sb.from('organization_verification_requests').insert({
        organization_id:orgId, requested_by:S.user.id, website_url:p.website || null,
        email_domain:((p.email || '').split('@')[1] || '') || null,
        social_url:v.social || null, registration_info:v.registration || null, athletic_dept_info:v.athletic || null, district_info:v.district || null });
    }
  }catch(e){}
  track('org_signup_completed', { organization_type:draft.payload.organization_type }, 'org_signup_completed:' + S.user.id, orgId);
  try{ localStorage.removeItem(DRAFT_KEY); localStorage.removeItem(LOGO_KEY); }catch(e){}
  if(fromMeta){ try{ await sb.auth.updateUser({ data:{ org_draft:null } }); }catch(e){} }
  try{ localStorage.removeItem(WELCOME_KEY); }catch(e){}
  return true;
}
function normalizeWebsite(v){ v = (v||'').trim(); if(!v) return ''; return /^[a-z][a-z0-9+.-]*:\/\//i.test(v) ? v : 'https://' + v; }
function localDraftToMeta(d){
  const c = v => { const n = Number(v); return Number.isFinite(n) && n > 0 ? Math.round(n*100) : null; };
  const md = S.user.user_metadata || {};
  return { v:1, anon:anonId(), payload:{
    organization_name:d.org_name.trim(), organization_type:d.org_type, description:(d.description||'').trim(), website:normalizeWebsite(d.website),
    email:(d.org_email||'').trim(), phone:(d.org_phone||'').trim(), address:(d.address||'').trim(), city:(d.city||'').trim(), state:d.state, zip:(d.zip||'').trim(), country:d.country,
    employee_count:d.employee_count, athlete_count:d.athlete_count, preferred_format:d.format, budget_min_cents:c(d.budget_min), budget_max_cents:c(d.budget_max),
    member:{ first_name:d.first_name || md.first_name || '', last_name:d.last_name || md.last_name || '', job_title:d.job_title || md.job_title || '' },
    sports:(d.sports||[]).map(s => s === 'Other' ? { name:'Other', custom:(d.other_sport||'').trim() } : { name:s }),
    expertise:Object.entries(d.expertise||{}).flatMap(([sport,names]) => names.map(name => ({ sport, name }))),
    needs:(d.needs||[]).map(n => n === 'Other' ? { type:'Other', custom:(d.other_need||'').trim() } : { type:n }) },
    verification: [d.v_social,d.v_registration,d.v_athletic,d.v_district].some(Boolean) ? { social:d.v_social, registration:d.v_registration, athletic:d.v_athletic, district:d.v_district } : undefined };
}

/* ---------------- profile completion + recommendations ---------------- */
function orgSports(){ return (S.org.organization_sports || []).map(r => r.custom_name || r.sports?.name).filter(Boolean); }
function orgExpertise(){ return (S.org.organization_expertise || []).map(r => r.expertise).filter(Boolean); }
function orgNeeds(){ return (S.org.organization_needs || []).map(r => r.need_type); }

function completion(){
  const o = S.org;
  const checks = [
    ['Add your organization name and type', !!(o.organization_name && o.organization_type)],
    ['Write a description (50+ characters)', (o.description || '').trim().length >= 50],
    ['Upload your logo', !!o.logo_url],
    ['Add your website', !!o.website],
    ['Add your city and state', !!(o.city && o.state)],
    ['Add an organization email or phone', !!(o.email || o.phone)],
    ['Choose the sports you support', orgSports().length > 0],
    ['Pick areas of expertise you need', orgExpertise().length > 0],
    ['Choose what a coach can help with', orgNeeds().length > 0],
    ['Say how large your organization is', !!(o.employee_count && o.athlete_count)],
    ['Choose virtual, in-person or either', !!o.preferred_format]
  ];
  const done = checks.filter(c => c[1]).length;
  return { pct:Math.round(done / checks.length * 100), checks };
}
function trackProfileCompletion(){
  if(completion().pct >= 80) track('profile_completed', { pct:completion().pct }, 'profile_completed:' + S.org.id, S.org.id);
}

async function loadCoaches(){
  if(S.coaches) return;
  const { data } = await sb.from('profiles')
    .select('id,name,sport,bio,verified,specialties,coaching_levels,session_formats,rate_min_cents,rate_max_cents,headline,years_experience,city,state,certifications,accomplishments,availability')
    .eq('role','Coach').limit(500);
  S.coaches = data || [];
}

function scoreCoach(c){
  const o = S.org, reasons = []; let score = 0;
  const sports = orgSports().map(s => s.toLowerCase());
  if(c.sport && sports.includes(c.sport.toLowerCase())){ score += 40; reasons.push(`${c.sport} coach`); }

  const wanted = new Set();
  orgExpertise().forEach(x => x.coach_specialty && wanted.add(x.coach_specialty));
  orgNeeds().forEach(n => (NEED_TO_SPECIALTY[n] || []).forEach(s => wanted.add(s)));
  const overlap = (c.specialties || []).filter(s => wanted.has(s));
  if(overlap.length){ score += Math.min(30, overlap.length * 10); reasons.push(overlap.slice(0,2).join(' & ')); }

  const fmts = c.session_formats || [];
  if(o.preferred_format === 'virtual' && (fmts.includes('virtual') || fmts.includes('hybrid'))){ score += 10; reasons.push('Works virtually'); }
  else if(o.preferred_format === 'in_person' && (fmts.includes('in_person') || fmts.includes('hybrid'))){ score += 10; reasons.push('Works in person'); }
  else if(o.preferred_format === 'either' && fmts.length){ score += 5; }

  if(o.preferred_format !== 'virtual' && c.state && o.state && c.state === o.state){
    score += 8; if(c.city && o.city && c.city.toLowerCase() === o.city.toLowerCase()){ score += 5; reasons.push('Local to you'); } else reasons.push(`In ${c.state}`);
  }
  if(o.budget_max_cents && c.rate_min_cents){ if(c.rate_min_cents <= o.budget_max_cents){ score += 8; reasons.push('Fits your budget'); } else score -= 10; }

  const levels = LEVELS_FOR_TYPE[o.organization_type] || [];
  if(levels.length && (c.coaching_levels || []).some(l => levels.includes(l))){ score += 8; reasons.push(`Coaches ${o.organization_type.toLowerCase()} level`); }
  if(c.verified){ score += 8; reasons.push('Verified'); }
  if(c.availability === 'available') score += 4; else if(c.availability === 'unavailable') score -= 15;
  return { score, reasons:[...new Set(reasons)].slice(0,3) };
}
function recommended(limit = 6){
  return (S.coaches || []).map(c => ({ c, ...scoreCoach(c) })).filter(x => x.score > 0).sort((a,b) => b.score - a.score).slice(0, limit);
}

  const rate = c.rate_min_cents ? `From ${money(c.rate_min_cents)}` : '';
  const loc = [c.city, c.state].filter(Boolean).join(', ');
  return `<article class="coach">
    <div class="coach-top"><div class="avatar" aria-hidden="true">${esc(initials(c.name))}</div>
      <div><h3>${esc(c.name)}</h3><div class="headline">${esc(c.headline || (c.sport ? c.sport + ' coach' : 'Coach'))}</div></div></div>
    <div class="meta-row">
      ${c.sport ? `<span class="pill">${esc(c.sport)}</span>` : ''}
      ${c.verified ? `<span class="pill good">✓ Verified</span>` : ''}
      ${c.years_experience != null ? `<span class="pill">${esc(c.years_experience)} yrs experience</span>` : ''}
      ${c.availability === 'available' ? `<span class="pill gold">Available</span>` : c.availability === 'limited' ? `<span class="pill">Limited availability</span>` : ''}
      ${rate ? `<span class="pill">${esc(rate)}</span>` : ''}
      ${loc ? `<span class="pill">${esc(loc)}</span>` : ''}
    </div>
    ${c.accomplishments ? `<div class="muted" style="font-size:12.5px"><b>Accomplishments:</b> ${esc(c.accomplishments.slice(0,110))}${c.accomplishments.length > 110 ? '…' : ''}</div>` : ''}
    ${c.certifications ? `<div class="muted" style="font-size:12.5px"><b>Certifications:</b> ${esc(c.certifications.slice(0,90))}${c.certifications.length > 90 ? '…' : ''}</div>` : ''}
    ${(c.specialties || []).length ? `<div class="meta-row">${c.specialties.slice(0,4).map(s => `<span class="pill">${esc(s)}</span>`).join('')}</div>` : ''}
    ${why && why.length ? `<div class="why">Why recommended: ${esc(why.join(' · '))}</div>` : ''}
    <div class="acts">
      <a class="btn btn-ghost btn-sm" href="profile.html?id=${encodeURIComponent(c.id)}" target="_blank" rel="noopener" data-view-coach="${esc(c.id)}">View Profile</a>
      <button class="btn btn-dark btn-sm" data-contact-coach="${esc(c.id)}" data-kind="message" ${can('contact_coaches') ? '' : 'disabled title="Your role can\'t contact coaches"'}>Message Coach</button>

    </div></article>`;
}

function readFilters(){
  S.filters = {
    sport:document.getElementById('q-sport').value, format:document.getElementById('q-format').value, availability:document.getElementById('q-avail').value,
    specialties:[...document.querySelectorAll('input[name="q-spec"]:checked')].map(i => i.value),
    state:document.getElementById('q-state').value, city:document.getElementById('q-city').value.trim(), minYears:document.getElementById('q-years').value,
    cert:document.getElementById('q-cert').value.trim(), accomplishments:document.getElementById('q-acc').value.trim(), maxPrice:document.getElementById('q-price').value,
    verifiedOnly:document.getElementById('q-verified').checked
  };
  S.resultLimit = 24;
}
function runSearch(tracked){
  const f = S.filters, has = (hay, needle) => (hay || '').toLowerCase().includes(needle.toLowerCase());
  let list = (S.coaches || []).filter(c => {
    if(f.sport && (c.sport || '').toLowerCase() !== f.sport.toLowerCase()) return false;
    if(f.specialties.length && !f.specialties.every(s => (c.specialties || []).includes(s))) return false;
    if(f.state && c.state !== f.state) return false;
    if(f.city && !has(c.city, f.city)) return false;
    if(f.minYears && !(c.years_experience >= Number(f.minYears))) return false;
    if(f.cert && !has(c.certifications, f.cert)) return false;
    if(f.accomplishments && !has(c.accomplishments, f.accomplishments)) return false;
    if(f.availability && c.availability !== f.availability) return false;
    if(f.format){ const fm = c.session_formats || []; if(!(fm.includes(f.format) || fm.includes('hybrid'))) return false; }
    if(f.maxPrice && !(c.rate_min_cents != null && c.rate_min_cents <= Number(f.maxPrice) * 100)) return false;
    if(f.verifiedOnly && !c.verified) return false;
    return true;
  }).map(c => ({ c, ...scoreCoach(c) }));
  // Verified coaches first, then best match.
  list.sort((a,b) => (b.c.verified - a.c.verified) || (b.score - a.score) || a.c.name.localeCompare(b.c.name));
  S.results = list;
  if(tracked){
    const used = Object.entries(f).filter(([k,v]) => Array.isArray(v) ? v.length : v).map(([k]) => k);
    track('coach_search_performed', { filters:used, results:list.length });
  }
}

function openContactModal(coachId, kind){

  openModal(`

function bindOppList(panel){

function bindAppButtons(panel){
  panel.querySelectorAll('[data-app-act]').forEach(b => b.addEventListener('click', async () => {

async function onLogoUpload(e){
  const f = e.target.files[0], err = document.getElementById('logo-err'); err.textContent = '';
  if(!f) return;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)){ err.textContent = 'Please choose a PNG, JPG or WebP image.'; return; }
  if(f.size > 2*1024*1024){ err.textContent = 'That file is over 2 MB.'; return; }
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(f); }).catch(() => null);
  if(!img){ err.textContent = 'We couldn\'t read that image.'; return; }
  const scale = Math.min(1, 512 / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const path = `${S.org.id}/logo.png`;
  const up = await sb.storage.from('org-logos').upload(path, blob, { upsert:true, contentType:'image/png' });
  if(up.error){ err.textContent = friendly(up.error); return; }
  const url = sb.storage.from('org-logos').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
  const { error } = await sb.from('organizations').update({ logo_url:url }).eq('id', S.org.id);
  if(error){ err.textContent = friendly(error); return; }
  S.org.logo_url = url; toast('Logo updated'); render();
}

  if(site){ try{ const u = new URL(site); if(!u.hostname.includes('.')) throw 0; }catch(e){ err.textContent = 'Enter a valid website.'; return; } }
  const bmin = Number(g('p-bmin')), bmax = Number(g('p-bmax'));

  const sports = [...document.querySelectorAll('input[name="p-sport"]:checked')].map(i => i.value);

  const btn = document.getElementById('p-save'); btn.disabled = true; btn.textContent = 'Saving…';
  const fmt = document.querySelector('input[name="p-format"]:checked');
  const patch = { organization_name:name, organization_type:g('p-type'), website:site || null, email:g('p-email') || null, phone:g('p-phone') || null,
    description:g('p-desc') || null, address:g('p-addr') || null, city, state:document.getElementById('p-state').value || null, zip:g('p-zip') || null, country:g('p-country'),
    employee_count:g('p-emp') || null, athlete_count:g('p-ath') || null, preferred_format:fmt ? fmt.value : null,
    budget_min_cents:bmin > 0 ? Math.round(bmin*100) : null, budget_max_cents:bmax > 0 ? Math.round(bmax*100) : null };
  const up = await sb.from('organizations').update(patch).eq('id', S.org.id);
  if(up.error){ btn.disabled = false; btn.textContent = 'Save profile'; err.textContent = up.error.message.includes('duplicate key') ? 'Another organization already uses that name in this city, or that website.' : friendly(up.error); window.scrollTo({ top:0, behavior:'smooth' }); return; }

  // Replace the child rows (sports, expertise, needs) with the current selections.
  const oid = S.org.id, exp = readProfileExpertise();
  await Promise.all([sb.from('organization_sports').delete().eq('organization_id', oid), sb.from('organization_expertise').delete().eq('organization_id', oid), sb.from('organization_needs').delete().eq('organization_id', oid)]);
  const { data:sportRows } = await sb.from('sports').select('id,name').in('name', sports.length ? sports : ['__none__']);
  const sid = Object.fromEntries((sportRows || []).map(r => [r.name, r.id]));
  if(sports.length) await sb.from('organization_sports').insert(sports.filter(s => sid[s]).map(s => ({ organization_id:oid, sport_id:sid[s], custom_name: s === 'Other' ? g('p-other-sport') : null })));
  const wantedExp = Object.entries(exp).filter(([s]) => sports.includes(s));
  if(wantedExp.length){
    const { data:exRows } = await sb.from('expertise').select('id,name,sports!inner(name)').in('sports.name', wantedExp.map(([s]) => s));
    const ids = (exRows || []).filter(r => (exp[r.sports.name] || []).includes(r.name)).map(r => ({ organization_id:oid, expertise_id:r.id }));
    if(ids.length) await sb.from('organization_expertise').insert(ids);
  }
  if(needs.length) await sb.from('organization_needs').insert(needs.map(n => ({ organization_id:oid, need_type:n, custom_text: n === 'Other' ? g('p-other-need') : null })));
  S.coaches = null; S.results = null;
  await loadOrgData(); await loadMemberships();
  toast('Profile saved'); render();
}

/* ---------------- Team ---------------- */
async function viewTeam(panel){
  const manage = can('manage_members'), amOwner = S.member.role === 'owner';
  const assignable = ROLES.filter(r => r.v !== 'owner' || amOwner);
  panel.innerHTML = `<div class="sec-title">Team</div>
    <div class="card"><h2>Members</h2>
      ${S.members.map(m => { const me = m.user_id === S.user.id;
        const locked = !manage || (['owner','admin'].includes(m.role) && !amOwner);
        return `<div class="row"><div><b>${esc(m.display_name || 'Team member')}${me ? ' (you)' : ''}</b><div class="muted">${esc(m.job_title || '')}${m.job_title ? ' · ' : ''}joined ${esc(fmtDate(m.created_at))}</div></div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
            <select data-role-for="${esc(m.id)}" ${locked ? 'disabled' : ''} aria-label="Role" style="min-height:36px; padding:6px 8px; width:auto">${ROLES.map(r => `<option value="${r.v}" ${m.role === r.v ? 'selected' : ''} ${(r.v === 'owner' && !amOwner) ? 'disabled' : ''}>${esc(r.l)}</option>`).join('')}</select>
            ${(me || (manage && !locked)) ? `<button class="btn btn-danger btn-sm" data-remove-member="${esc(m.id)}">${me ? 'Leave' : 'Remove'}</button>` : ''}</div></div>`; }).join('')}
    </div>
    ${manage ? `<div class="card"><h2>Invite a teammate</h2>
      <div class="grid2"><div><label class="lbl" for="inv-email">Their email</label><input id="inv-email" type="email" placeholder="name@yourschool.org"></div>
      <div><label class="lbl" for="inv-role">Role</label><select id="inv-role">${assignable.filter(r => r.v !== 'owner').map(r => `<option value="${r.v}" ${r.v === 'hiring_manager' ? 'selected' : ''}>${esc(r.l)}</option>`).join('')}</select></div></div>
      <div id="inv-err" class="ferr"></div>
      <div style="margin-top:12px"><button class="btn btn-gold" id="inv-send">Create invitation</button></div>
      <p class="hint" style="margin-top:10px">We'll record the invitation. Ask your teammate to create an account (or sign in) at <b>${esc(location.origin)}/login.html</b> with <b>that email address</b> — they'll see the invitation on their dashboard and can accept it.</p>
      ${S.teamInvites.length ? `<h3 style="margin-top:16px">Pending invitations</h3>${S.teamInvites.map(i => `<div class="row"><div><b>${esc(i.email)}</b><div class="muted">${esc(ROLE_LABEL[i.role])} · invited ${esc(fmtDate(i.created_at))}</div></div><button class="btn btn-danger btn-sm" data-revoke-invite="${esc(i.id)}">Revoke</button></div>`).join('')}` : ''}
    </div>` : ''}
    <div class="card"><h2>What each role can do</h2><table class="tbl"><thead><tr><th>Role</th><th>Access</th></tr></thead><tbody>${ROLES.map(r => `<tr><td><b>${esc(r.l)}</b></td><td>${esc(r.d)}</td></tr>`).join('')}</tbody></table></div>`;
  panel.querySelectorAll('[data-role-for]').forEach(sel => sel.addEventListener('change', async () => {
    const { error } = await sb.from('organization_members').update({ role:sel.value }).eq('id', sel.dataset.roleFor);
    if(error){ toast(friendly(error)); await loadOrgData(); viewTeam(panel); return; }
    toast('Role updated'); await loadOrgData(); viewTeam(panel);
  }));
  panel.querySelectorAll('[data-remove-member]').forEach(b => b.addEventListener('click', async () => {
    const m = S.members.find(x => x.id === b.dataset.removeMember), me = m.user_id === S.user.id;
    if(!confirm(me ? 'Leave this organization?' : `Remove ${m.display_name || 'this member'} from the team?`)) return;
    const { error } = await sb.from('organization_members').delete().eq('id', m.id);
    if(error){ toast(friendly(error)); return; }
    if(me){ toast('You left the organization'); setTimeout(() => location.reload(), 600); return; }
    toast('Member removed'); await loadOrgData(); viewTeam(panel);
  }));
  const send = document.getElementById('inv-send');
  if(send) send.addEventListener('click', async () => {
    const email = document.getElementById('inv-email').value.trim().toLowerCase(), err = document.getElementById('inv-err'); err.textContent = '';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){ err.textContent = 'Enter a valid email address.'; return; }
    if(S.members.length && S.teamInvites.some(i => i.email.toLowerCase() === email)){ err.textContent = 'That address already has a pending invitation.'; return; }
    send.disabled = true;
    const { error } = await sb.from('organization_invites').insert({ organization_id:S.org.id, email, role:document.getElementById('inv-role').value, invited_by:S.user.id });
    send.disabled = false;
    if(error){ err.textContent = error.message.includes('duplicate key') ? 'That address already has a pending invitation.' : friendly(error); return; }
    track('org_invite_sent', { role:document.getElementById('inv-role').value });
    toast('Invitation created'); await loadOrgData(); viewTeam(panel);
  });
  panel.querySelectorAll('[data-revoke-invite]').forEach(b => b.addEventListener('click', async () => {
    const { error } = await sb.from('organization_invites').update({ status:'revoked' }).eq('id', b.dataset.revokeInvite);
    if(error){ toast(friendly(error)); return; }
    toast('Invitation revoked'); await loadOrgData(); viewTeam(panel);
  }));
}

/* ---------------- Verification ---------------- */
async function viewVerification(panel){
  const o = S.org, last = S.verifications[0], pending = last && last.status === 'pending', manage = can('manage_org');
  panel.innerHTML = `<div class="sec-title">Verification</div>
    <div class="card"><div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap">${vbadge(o.verification_status)}</div>
      <p style="margin-top:10px; font-size:14px">Verified organizations display a <b>Verified Organization ✓</b> badge and earn more trust and visibility with coaches. Verification is optional and reviewed by our team.</p>
      ${o.verification_status === 'verified' ? '<p class="muted" style="margin-top:8px">Your organization is verified. Thank you!</p>' : ''}
      ${pending ? `<p class="muted" style="margin-top:8px">Your request was submitted ${esc(fmtDate(last.created_at))} and is under review.</p>` : ''}
      ${last && last.status === 'rejected' ? `<div class="banner" style="margin-top:12px"><b>Your last request wasn't approved.</b>${last.reviewer_note ? ' ' + esc(last.reviewer_note) : ''} You can submit a new request below.</div>` : ''}
    </div>
    ${(o.verification_status !== 'verified' && !pending) ? (manage ? `
    <div class="card"><h2>Request verification</h2>
      <p class="muted">Share whatever applies — the more we can confirm, the faster the review.</p>
      <div id="vr-err" class="ferr" role="alert"></div>
      <div class="grid2"><div><label class="lbl" for="vr-web">Official website</label><input id="vr-web" type="text" value="${esc(o.website || '')}"></div>
      <div><label class="lbl" for="vr-domain">Organization email domain</label><input id="vr-domain" type="text" value="${esc((o.email || '').split('@')[1] || '')}" placeholder="yourschool.org"></div></div>
      <label class="lbl" for="vr-social">Social media profile</label><input id="vr-social" type="url" placeholder="https://facebook.com/yourprogram">
      <label class="lbl" for="vr-reg">Business / organization registration info</label><textarea id="vr-reg" maxlength="1000" style="min-height:70px" placeholder="e.g. EIN, state registration number, nonprofit ID"></textarea>
      <label class="lbl" for="vr-ath">Athletic department information</label><textarea id="vr-ath" maxlength="1000" style="min-height:70px" placeholder="e.g. athletic director's name and a staff directory link"></textarea>
      <label class="lbl" for="vr-dist">School district information</label><textarea id="vr-dist" maxlength="1000" style="min-height:70px" placeholder="e.g. district name and your school's page on the district site"></textarea>
      <label class="lbl" for="vr-docs">Supporting documents <span class="opt">(PDF, PNG or JPG, up to 10 MB each — private)</span></label><input id="vr-docs" type="file" multiple accept="application/pdf,image/png,image/jpeg">
      <div style="margin-top:16px"><button class="btn btn-gold" id="vr-submit">Submit for review</button></div></div>`
      : `<div class="card"><div class="empty"><b>Only owners and administrators can request verification</b></div></div>`) : ''}`;
  const submit = document.getElementById('vr-submit');
  if(submit) submit.addEventListener('click', async () => {
    const g = id => document.getElementById(id).value.trim(), err = document.getElementById('vr-err'); err.textContent = '';
    const data = { web:g('vr-web'), domain:g('vr-domain'), social:g('vr-social'), reg:g('vr-reg'), ath:g('vr-ath'), dist:g('vr-dist') };
    const files = [...document.getElementById('vr-docs').files];
    if(!Object.values(data).some(Boolean) && !files.length){ err.textContent = 'Add at least one detail or document so we have something to review.'; return; }
    for(const f of files){ if(f.size > 10*1024*1024){ err.textContent = `${f.name} is over 10 MB.`; return; } if(!/^(application\/pdf|image\/png|image\/jpeg)$/.test(f.type)){ err.textContent = `${f.name} isn't a PDF, PNG or JPG.`; return; } }
    submit.disabled = true; submit.textContent = 'Submitting…';
    const paths = [];
    for(const f of files){
      const path = `${S.org.id}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
      const up = await sb.storage.from('org-verification').upload(path, f, { contentType:f.type });
      if(up.error){ err.textContent = `Couldn't upload ${f.name}: ${friendly(up.error)}`; submit.disabled = false; submit.textContent = 'Submit for review'; return; }
      paths.push(path);
    }
    const { error } = await sb.from('organization_verification_requests').insert({ organization_id:S.org.id, requested_by:S.user.id, website_url:normalizeWebsite(data.web) || null, email_domain:data.domain || null,
      social_url:data.social || null, registration_info:data.reg || null, athletic_dept_info:data.ath || null, district_info:data.dist || null, document_paths:paths });
    if(error){ err.textContent = friendly(error); submit.disabled = false; submit.textContent = 'Submit for review'; return; }
    track('organization_verification_requested', { documents:paths.length });
    toast('Submitted — we\'ll review it soon'); await loadOrgData(); render();
  });
}

boot().catch(e => { console.error(e); document.getElementById('shell').innerHTML = `<div class="card" style="grid-column:1/-1"><div class="empty"><b>Something went wrong</b>Please refresh the page. ${esc(e && e.message || '')}</div></div>`; });
</script>
