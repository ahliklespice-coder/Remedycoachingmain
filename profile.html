<style>

    --field:#16342A;

  .strength-track{background:var(--chalk-dim); border-radius:20px; height:10px; overflow:hidden;}
  .strength-fill{background:linear-gradient(90deg,var(--turf),var(--gold)); height:100%; border-radius:20px;}

  /* ---------- SAMPLE CONTENT LABELS ----------

     Everything built from it carries a "Sample" chip plus a banner. */
  .sample-chip{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; background:#D4A72C; color:#16342A; padding:2px 8px; border-radius:99px; vertical-align:middle; white-space:nowrap;}
  .empty-state{text-align:center; padding:70px 20px; color:#a8a596;}
  .empty-state .display{font-size:22px; color:var(--field); margin-bottom:8px;}
  .skeleton{background:#fff; border:1px solid rgba(28,27,24,.08); border-radius:14px; padding:20px; color:#c7c4b6; font-size:13.5px;}
  .setup-warning{background:#b5453f; color:#fff; text-align:center; padding:10px 16px; font-size:13.5px; font-family:'IBM Plex Mono',monospace;}






  /* ---------- HEADER SPACING FIX ----------
     Keeps the logo, nav links and buttons on one line with real gaps between
     them: nothing wraps or shrinks into the logo, and the link row hides
     (as it already did on small screens) before it would collide. */

<script>
const SUPABASE_URL = 'https://gaeekblnbhxtcqdeesra.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_D04JKsI8CJOUihOiQFr8xA_HCMt5Hhs';

const isConfigured = !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');
if(!isConfigured){ document.getElementById('setup-warning').style.display = 'block'; }
const sb = isConfigured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function initials(name){
  return (name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('') || '?';
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

/* Coaching Strengths & Expertise visual — one horizontal bar per specialty,
   filled by the coach's own 1-5 self-rating (supabase-setup-strengths.sql).
   Same markup/logic as dashboard.html's strengthBarsHtml(), duplicated here
   per this repo's no-shared-JS-module convention. If specialties/
   specialty_ratings haven't been migrated yet, profile.specialties is just
   undefined and this renders the empty state below — no error thrown,
   since profile.html already does `select('*')`. */
const STRENGTH_LEVELS = { 1:'Developing', 2:'Solid', 3:'Strong', 4:'Advanced', 5:'Signature Strength' };

function strengthRatingFor(p, specialty){
  const raw = p.specialty_ratings && typeof p.specialty_ratings === 'object' ? p.specialty_ratings[specialty] : null;
  const n = parseInt(raw, 10);
  return Number.isFinite(n) && n >= 1 && n <= 5 ? n : 3;
}

function strengthBarsHtml(p){
  const list = Array.isArray(p.specialties) ? p.specialties : [];
  if(!list.length){
    return `<p class="strength-empty">This coach hasn't listed specialty areas yet.</p>`;
  }
  return `
    ${list.map(s => {
      const val = strengthRatingFor(p, s);
      return `
      <div class="strength-row">
        <div class="strength-row-top">
          <span class="strength-name">${escapeHtml(s)}</span>
          <span class="strength-level">${escapeHtml(STRENGTH_LEVELS[val])}</span>
        </div>
        <div class="strength-track"><div class="strength-fill" style="width:${val*20}%"></div></div>
      </div>`;
    }).join('')}
    <div class="strength-caption">Self-rated by the coach.</div>`;
}


const SAMPLE_COACHES = [
  { id:'sample-1', name:'Marisol Quenby', role:'Coach', sport:'Basketball', verified:false, sample:true,
    bio:'Former collegiate point guard turned skills coach. Focus on ball handling, decision-making and film-based game prep for high school and club players.',
    specialties:['Skill Development','Game Strategy','Recruiting Guidance'], specialty_ratings:{'Skill Development':5,'Game Strategy':4,'Recruiting Guidance':3},
    credentials:[{title:'Advanced Coaching Certificate (Sample)', issuer:'Sample Coaching Association'},{title:'First Aid & CPR (Sample)', issuer:'Sample Safety Council'}] },
  { id:'sample-2', name:'Dexter Halloran', role:'Coach', sport:'Wrestling', verified:false, sample:true,
    bio:'Twenty years on the mat as an athlete and coach. Specializes in neutral-position technique and building a sound cutting and recovery plan.',
    specialties:['Position-Specific Training','Mental Performance','Injury Recovery'], specialty_ratings:{'Position-Specific Training':5,'Mental Performance':4,'Injury Recovery':3},
    credentials:[{title:'Level 3 Wrestling Coach Certificate (Sample)', issuer:'Sample Wrestling Federation'}] },
  { id:'sample-3', name:'Imani Castellano', role:'Coach', sport:'Soccer', verified:false, sample:true,
    bio:'Goalkeeper and defensive-unit coach. Runs small-group sessions on positioning, distribution and communication, in person or over video review.',
    specialties:['Position-Specific Training','Team Building','Game Strategy'], specialty_ratings:{'Position-Specific Training':5,'Team Building':4,'Game Strategy':4},
    credentials:[{title:'Goalkeeping Licence (Sample)', issuer:'Sample Football Association'}] },
  { id:'sample-4', name:'Tobias Lindqvist', role:'Coach', sport:'Swimming', verified:false, sample:true,
    bio:'Stroke-mechanics specialist working with age-group and masters swimmers. Underwater video analysis and race-pace planning.',
    specialties:['Skill Development','Strength & Conditioning'], specialty_ratings:{'Skill Development':5,'Strength & Conditioning':3},
    credentials:[{title:'Swim Coach Certification (Sample)', issuer:'Sample Aquatics Board'}] },
  { id:'sample-5', name:'Renata Voss', role:'Coach', sport:'Strength & Conditioning', verified:false, sample:true,
    bio:'Builds off-season and in-season programs for team sports. Emphasis on durability, speed development and return-to-play progressions.',
    specialties:['Strength & Conditioning','Injury Recovery','Mental Performance'], specialty_ratings:{'Strength & Conditioning':5,'Injury Recovery':4,'Mental Performance':3},
    credentials:[{title:'Strength & Conditioning Specialist (Sample)', issuer:'Sample Strength Institute'}] },
  { id:'sample-6', name:'Calvin Ashgrove', role:'Coach', sport:'Pickleball', verified:false, sample:true,
    bio:'Teaching pro for beginner through tournament-level players. Third-shot drops, dinking strategy and doubles positioning.',
    specialties:['Skill Development','Game Strategy'], specialty_ratings:{'Skill Development':4,'Game Strategy':5},
    credentials:[{title:'Teaching Professional Certificate (Sample)', issuer:'Sample Racquet Association'}] },
  { id:'sample-7', name:'Hannah Pellerin', role:'Coach', sport:'Archery', verified:false, sample:true,
    bio:'Target archery coach for juniors and adults. Form, consistency and competition mindset, with a focus on safe range habits.',
    specialties:['Skill Development','Mental Performance'], specialty_ratings:{'Skill Development':4,'Mental Performance':5},
    credentials:[{title:'Archery Instructor Certificate (Sample)', issuer:'Sample Archery Society'}] }
];

/* The SAMPLE_* data above is fictional placeholder content, shown ONLY when the
   database has no real records, and always tagged with a small "Sample" chip. */

function renderNotFound(message){
  document.getElementById('page-content').innerHTML = `
    <div class="wrap" style="padding-top:60px;">
      <div class="card empty-state">
        <div class="display">Profile not found</div>
        <div>${escapeHtml(message || "This coach's profile doesn't exist or was removed.")}</div>
        <a href="coaches.html" class="btn btn-outline-dark" style="margin-top:20px; display:inline-block;">← Back to directory</a>
      </div>
    </div>`;
}

function renderProfile(profile, credentials){
  const verifiedBadge = profile.sample
    ? `<div><span class="sample-chip">Sample profile</span></div>`
    : profile.verified
      ? `<div class="badge-verified">✓ Verified Credentials</div>`
      : `<div class="badge-pending">Not yet verified</div>`;

  const credsHtml = credentials.length
    ? `<div class="cred-list">${credentials.map(c => `
        <div class="cred-row">
          <div>
            <div class="cred-title">${escapeHtml(c.title)}</div>
            ${c.issuer ? `<div class="cred-issuer">${escapeHtml(c.issuer)}</div>` : ''}
          </div>
          <div class="cred-check">${profile.sample ? '<span class="sample-chip">Sample</span>' : '✓ Approved'}</div>
        </div>
      `).join('')}</div>`
    : `<p style="font-size:13.5px; color:#a8a596;">No approved credentials on file yet.</p>`;

  document.getElementById('page-content').innerHTML = `
    <section class="profile-hero">
      <div class="wrap">
        <a href="coaches.html" class="back-link">← Back to directory</a>
        <div class="hero-top">
          <div class="avatar">${initials(profile.name)}</div>
          <div>
            <div class="display hero-name">${escapeHtml(profile.name)}</div>
            <div class="hero-role">${escapeHtml(profile.role)} · ${escapeHtml(profile.sport)}${[profile.city, profile.state].filter(Boolean).length ? ' · ' + escapeHtml([profile.city, profile.state].filter(Boolean).join(', ')) : ''}</div>
            ${profile.headline ? `<div style="margin-top:6px; opacity:.85;">${escapeHtml(profile.headline)}</div>` : ''}
            ${verifiedBadge}
          </div>
        </div>
      </div>
    </section>
    <main>
      <div class="wrap">
        <div class="card">
          <h2>About</h2>
          <div class="bio-text">${profile.bio ? escapeHtml(profile.bio) : 'This coach hasn’t added a bio yet.'}</div>
          <div class="tags"><span class="tag">${escapeHtml(profile.sport)}</span><span class="tag">${escapeHtml(profile.role)}</span>${profile.years_experience != null ? `<span class="tag">${escapeHtml(profile.years_experience)} yrs experience</span>` : ''}${profile.availability === 'available' ? '<span class="tag">Available now</span>' : profile.availability === 'limited' ? '<span class="tag">Limited availability</span>' : ''}</div>
        </div>
        ${(profile.certifications || profile.accomplishments) ? `
        <div class="card">
          <h2>Certifications &amp; Accomplishments</h2>
          ${profile.certifications ? `<div class="bio-text"><b>Certifications:</b> ${escapeHtml(profile.certifications)}</div>` : ''}
          ${profile.accomplishments ? `<div class="bio-text" style="margin-top:8px;"><b>Accomplishments:</b> ${escapeHtml(profile.accomplishments)}</div>` : ''}
        </div>` : ''}
        ${profile.role === 'Coach' ? `
        <div class="card">
          <h2>Coaching Strengths &amp; Expertise</h2>
          ${strengthBarsHtml(profile)}
        </div>` : ''}
        <div class="card">
          <h2>Credentials</h2>
          ${credsHtml}
        </div>
      </div>
    </main>`;
}

async function init(){
  // Sample profiles (linked from the directory when it has no real coaches)
  // are rendered from built-in placeholder data — never read from or written
  // to the database.
  const sampleId = new URLSearchParams(window.location.search).get('id');
  if(sampleId && sampleId.startsWith('sample-')){
    const sample = SAMPLE_COACHES.find(c => c.id === sampleId);
    if(!sample){ renderNotFound(); return; }
    document.title = `${sample.name} (Sample) — Remedy Coaching`;
    renderProfile(sample, sample.credentials);
    return;
  }
  if(!isConfigured){
    renderNotFound('Connect Supabase to load profiles.');
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(!id){
    renderNotFound('No coach was specified.');
    return;
  }

  const { data: profile, error: profileError } = await sb.from('profiles')
    .select('*')
    .eq('id', id)
    .maybeSingle();

  if(profileError || !profile){
    renderNotFound();
    return;
  }

  document.title = `${profile.name} — Remedy Coaching`;

  let credentials = [];
  const { data: credData, error: credError } = await sb.from('credentials')
    .select('*')
    .eq('coach_id', id)
    .eq('status', 'approved')
    .order('created_at', { ascending: false });
  if(!credError){ credentials = credData; }
  // If the credentials table hasn't been set up yet (see
  // supabase-setup-verification.sql), credError will be set — the page
  // still renders fine with an empty credentials list.

  renderProfile(profile, credentials);
  addCommunityLinkForOwner(profile);
}

/* The community forum is reached from your own profile (it's no longer in the
   site header). Only the signed-in owner of this profile sees the button. */
async function addCommunityLinkForOwner(profile){
  try {
    const { data: { session } } = await sb.auth.getSession();
    if(!session || session.user.id !== profile.id) return;
    const top = document.querySelector('.hero-top > div:last-child');
    if(!top) return;
    const a = document.createElement('a');
    a.href = 'community.html';
    a.className = 'btn btn-gold';
    a.style.cssText = 'display:inline-block; margin-top:14px;';
    a.textContent = 'Open Community Forum →';
    top.appendChild(a);
  } catch(e){ console.error(e); }
}

init();
</script>

<script>
/* Header "Dashboard" dropdown: opens on hover/focus via CSS; on touch devices the
   first tap opens it instead of navigating, and a tap elsewhere (or Esc) closes it. */
(function(){
  var dd = document.querySelector('.nav-dd'); if(!dd) return;
  var toggle = dd.querySelector('.nav-dd-toggle');
  function setOpen(o){ dd.classList.toggle('open', o); toggle.setAttribute('aria-expanded', o ? 'true' : 'false'); }
  toggle.addEventListener('click', function(e){
    if(window.matchMedia('(hover: none)').matches && !dd.classList.contains('open')){ e.preventDefault(); setOpen(true); }
  });
  document.addEventListener('click', function(e){ if(!dd.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ setOpen(false); toggle.blur(); } });
})();
</script>
</body>
</html>
