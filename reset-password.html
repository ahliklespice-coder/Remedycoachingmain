<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Remedy Coaching</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="https://remedycoachinggroup.com/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --field:#16342A; --turf:#2F6B4F; --chalk:#F5F3EA; --chalk-dim:#E7E2D3;
    --ink:#1C1B18; --gold:#D4A72C; --gold-dim:#E9C868; --line: rgba(245,243,234,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--field); color:var(--ink); font-family:'Inter',sans-serif; line-height:1.5; min-height:100vh;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}
  .display{font-family:'Anton',sans-serif; text-transform:uppercase;}
  header{position:sticky; top:0; background:rgba(22,52,42,0.96); border-bottom:1px solid var(--line); padding:16px 28px;}
  header .nav{display:flex; justify-content:space-between; align-items:center; max-width:1180px; margin:0 auto;}
  .logo{display:flex; align-items:center; gap:11px; color:var(--chalk); font-family:'Anton',sans-serif; font-size:18px;}
  .logo-mark{width:38px; height:38px;}
  .logo-word b{color:var(--gold); font-weight:inherit;}
  .btn-ghost{border:1.5px solid rgba(245,243,234,.35); color:var(--chalk); background:none; padding:10px 18px; border-radius:6px; font-weight:700; font-size:14px;}
  .authwrap{min-height:calc(100vh - 71px); display:flex; align-items:center; justify-content:center; padding:60px 20px;}
  .auth-card{width:100%; max-width:420px; background:var(--chalk); border-radius:16px; padding:36px 32px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.55);}
  .auth-card h1{font-size:26px;}
  .sub{color:#6b6a63; margin-top:8px; font-size:14px;}
  label{display:block; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--field); margin-top:16px; margin-bottom:6px;}
  input{width:100%; border:1.5px solid rgba(28,27,24,.15); border-radius:8px; padding:11px 12px; font-size:14.5px; background:#fdfcf9;}
  input:focus{outline:none; border-color:var(--turf);}
  .btn-gold{background:var(--gold); color:var(--ink); font-weight:700; font-size:14px; padding:11px 18px; border-radius:6px; border:none; width:100%; margin-top:18px;}
  .btn-gold:disabled{opacity:.55; cursor:not-allowed;}
  .auth-status{margin-top:14px; font-size:13.5px; min-height:1.2em;}
  .auth-status.error{color:#b5453f;}
  .auth-status.success{color:var(--turf); font-weight:600;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 60 60" role="img" aria-label="Remedy Coaching logo">
        <circle cx="30" cy="30" r="28" fill="#0F241C" stroke="rgba(245,243,234,0.16)" stroke-width="1"/>
        <path d="M45,17 A19,19 0 1 0 45,43" fill="none" stroke="var(--gold)" stroke-width="4.5" stroke-linecap="round"/>
        <text x="27" y="41" font-family="Anton, sans-serif" font-size="30" fill="var(--chalk)" text-anchor="middle">R</text>
      </svg>
      <span class="logo-word">REMEDY <b>COACHING</b></span>
    </a>
    <a href="index.html" class="btn-ghost">← Back to Home</a>
  </div>
</header>

<div class="authwrap">
  <div class="auth-card" id="card">
    <h1 class="display">Checking your link…</h1>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://gaeekblnbhxtcqdeesra.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_D04JKsI8CJOUihOiQFr8xA_HCMt5Hhs';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const card = document.getElementById('card');

function renderForm(){
  card.innerHTML = `
    <h1 class="display">Set a new password.</h1>
    <p class="sub">Choose a password with at least 8 characters.</p>
    <form id="reset-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
      <button type="submit" class="btn-gold" id="reset-submit">Set Password</button>
    </form>
    <div class="auth-status" id="reset-status"></div>
  `;
  document.getElementById('reset-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const status = document.getElementById('reset-status');
    const btn = document.getElementById('reset-submit');
    const pw = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    if(pw !== confirm){
      status.textContent = "Passwords don't match.";
      status.className = 'auth-status error';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Saving…';
    const { error } = await sb.auth.updateUser({ password: pw });
    if(error){
      status.textContent = error.message;
      status.className = 'auth-status error';
      btn.disabled = false;
      btn.textContent = 'Set Password';
      return;
    }
    status.textContent = 'Password updated — redirecting…';
    status.className = 'auth-status success';
    setTimeout(()=>{ window.location.href = 'dashboard.html'; }, 1200);
  });
}

function renderInvalid(){
  card.innerHTML = `
    <h1 class="display">Link expired or invalid.</h1>
    <p class="sub">Password reset links are single-use and expire after a short time.</p>
    <a href="login.html" class="btn-gold" style="display:block; text-align:center; text-decoration:none;">Request a new link</a>
  `;
}

(async function init(){
  // supabase-js auto-detects the recovery token in the URL on client init.
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    renderForm();
  } else {
    // Give detectSessionInUrl a moment to finish parsing the hash.
    sb.auth.onAuthStateChange((event, session) => {
      if(event === 'PASSWORD_RECOVERY' || session){ renderForm(); }
    });
    setTimeout(async () => {
      const { data: { session: retry } } = await sb.auth.getSession();
      if(!retry && card.querySelector('form') === null){ renderInvalid(); }
    }, 2000);
  }
})();
</script>

</body>
</html>
